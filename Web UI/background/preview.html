<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Backgrounds Preview | BRIANE</title>
    <meta name="description" content="Preview immersive weather backgrounds for BRIANE — Philippine climate-inspired dynamic scenes.">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="weather-backgrounds.css">
    <style>
        /* ── Preview Page Specific Styles ── */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ── Control Bar ── */
        .preview-controls {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            padding: 10px 12px;
            border-radius: 18px;
            display: flex;
            gap: 8px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .preview-btn {
            position: relative;
            padding: 12px 22px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.65);
            overflow: hidden;
        }

        .preview-btn .btn-icon {
            font-size: 1rem;
            line-height: 1;
        }

        .preview-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .preview-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .preview-btn.active {
            color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .preview-btn.active.btn-sunny {
            background: linear-gradient(135deg, #f59e0b, #f97316);
        }
        .preview-btn.active.btn-cloudy {
            background: linear-gradient(135deg, #64748b, #475569);
        }
        .preview-btn.active.btn-rainy {
            background: linear-gradient(135deg, #0284c7, #0369a1);
        }
        .preview-btn.active.btn-night {
            background: linear-gradient(135deg, #312e81, #1e1b4b);
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.2);
        }
        .preview-btn.active.btn-stormy {
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }

        /* ── Info Card ── */
        .sample-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 48px 42px;
            border-radius: 28px;
            width: 420px;
            max-width: 90vw;
            text-align: center;
            color: white;
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: box-shadow 0.5s ease;
        }

        .card-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .card-brand-icon {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .card-brand-name {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .sample-card h1 {
            font-size: 2.8rem;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.15;
        }

        .sample-card .subtitle {
            opacity: 0.65;
            font-size: 1rem;
            line-height: 1.6;
            max-width: 300px;
            margin: 0 auto;
        }

        .weather-label {
            display: inline-block;
            margin-top: 28px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .weather-label .weather-emoji {
            margin-right: 6px;
        }

        /* ── Temperature Display ── */
        .temp-display {
            margin-top: 20px;
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -2px;
            opacity: 0.9;
        }

        .temp-display .deg {
            font-size: 1.5rem;
            font-weight: 600;
            opacity: 0.6;
            vertical-align: super;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .preview-controls {
                bottom: 20px;
                gap: 5px;
                padding: 8px 10px;
                border-radius: 14px;
            }
            .preview-btn {
                padding: 10px 14px;
                font-size: 0.6rem;
            }
            .preview-btn .btn-label {
                display: none;
            }
            .sample-card {
                padding: 36px 28px;
            }
            .sample-card h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Container -->
    <div class="weather-bg-container bg-sunny"></div>

    <!-- Info Card -->
    <div class="sample-card" id="info-card">
        <div class="card-brand">
            <div class="card-brand-icon">🌊</div>
            <span class="card-brand-name">BRIANE</span>
        </div>
        <h1 id="card-title">Clear Skies</h1>
        <p class="subtitle">Previewing dynamic weather backgrounds for the Philippine climate.</p>
        <div class="temp-display" id="temp-display">34<span class="deg">°C</span></div>
        <div class="weather-label" id="weather-label">
            <span class="weather-emoji">☀️</span>
            <span id="label-text">Sunny</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="preview-controls" id="controls">
        <button class="preview-btn btn-sunny active" data-type="sunny" id="btn-sunny">
            <span class="btn-icon">☀️</span>
            <span class="btn-label">Sunny</span>
        </button>
        <button class="preview-btn btn-cloudy" data-type="cloudy" id="btn-cloudy">
            <span class="btn-icon">☁️</span>
            <span class="btn-label">Cloudy</span>
        </button>
        <button class="preview-btn btn-rainy" data-type="rainy" id="btn-rainy">
            <span class="btn-icon">🌧️</span>
            <span class="btn-label">Rainy</span>
        </button>
        <button class="preview-btn btn-night" data-type="night" id="btn-night">
            <span class="btn-icon">🌙</span>
            <span class="btn-label">Night</span>
        </button>
        <button class="preview-btn btn-stormy" data-type="stormy" id="btn-stormy">
            <span class="btn-icon">⛈️</span>
            <span class="btn-label">Stormy</span>
        </button>
    </div>

    <script src="background-manager.js"></script>
    <script>
        (function () {
            const weatherData = {
                sunny:  { title: 'Clear Skies',       temp: '34', emoji: '☀️',  label: 'Sunny'  },
                cloudy: { title: 'Overcast',          temp: '29', emoji: '☁️',  label: 'Cloudy' },
                rainy:  { title: 'Heavy Monsoon',     temp: '25', emoji: '🌧️', label: 'Rainy'  },
                night:  { title: 'Clear Night',       temp: '27', emoji: '🌙',  label: 'Night'  },
                stormy: { title: 'Typhoon Warning',   temp: '23', emoji: '⛈️',  label: 'Stormy' },
            };

            const controls = document.getElementById('controls');
            const btns = controls.querySelectorAll('.preview-btn');

            function switchTo(type) {
                setWeatherBackground(type);

                // Update active button
                btns.forEach(b => b.classList.remove('active'));
                const activeBtn = controls.querySelector(`[data-type="${type}"]`);
                if (activeBtn) activeBtn.classList.add('active');

                // Update card info
                const data = weatherData[type] || weatherData.sunny;
                document.getElementById('card-title').textContent = data.title;
                document.getElementById('temp-display').innerHTML =
                    `${data.temp}<span class="deg">°C</span>`;
                document.querySelector('#weather-label .weather-emoji').textContent = data.emoji;
                document.getElementById('label-text').textContent = data.label;
            }

            // Attach click handlers
            btns.forEach(btn => {
                btn.addEventListener('click', () => switchTo(btn.dataset.type));
            });

            // Keyboard nav (1-5)
            document.addEventListener('keydown', (e) => {
                const keyMap = { '1': 'sunny', '2': 'cloudy', '3': 'rainy', '4': 'night', '5': 'stormy' };
                if (keyMap[e.key]) switchTo(keyMap[e.key]);
            });

            // Initialize
            switchTo('sunny');
        })();
    </script>
</body>
</html>
